name: Portal Check
on:
  schedule:
    # 日本時間の 08:00から 18:50まで 10分おき
    - cron: '*/10 23,0-9 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 保存ファイルの更新に必要
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
      - name: Run script
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python portal_bot.py
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_personal.txt last_general.txt
          git commit -m "Update last check state" || echo "No changes to commit"
          git push
